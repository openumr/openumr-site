<meta name="description" content="OpenUMR 数据大厅 — 美股实时行情：纳指指数、热门中概、自选清单与 K 线图。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'%3EUMR%3C/text%3E%3C/svg%3E">
<script>
// 全局错误捕获：把首个 JS 错误写到 <html data-last-err>，便于线上诊断
window.addEventListener('error', function (e) {
  if (!document.documentElement.getAttribute('data-last-err')) {
    document.documentElement.setAttribute('data-last-err', (e.message || e.type) + ' @' + (e.lineno || '?'));
  }
});
</script>
<script>
// ============ 数据大厅访问保护 ============
// 未通过首页密码验证的会话直接返回首页（前端轻量防护）
if (sessionStorage.getItem('umr_gate') !== '1') {
  location.replace('index.html');
}
</script>
</head>

<div id="root"></div>
